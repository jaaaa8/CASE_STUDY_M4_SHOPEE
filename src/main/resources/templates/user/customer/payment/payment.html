<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
    <title>Thanh toán | Shopee</title>
</head>
<body>
<div th:replace="~{layout/main :: header}"></div>

<main class="container my-4">
    <div id="voucherMessage" class="alert d-none alert-dismissible fade show" role="alert">
        <span id="messageText"></span>
        <button type="button" class="btn-close" onclick="this.parentElement.classList.add('d-none')"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${error}">Thông báo lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="bg-white p-4 rounded shadow-sm mb-4">
        <h5 class="shopee-color mb-4"><i class="fas fa-map-marker-alt me-2"></i>Địa Chỉ Nhận Hàng</h5>
        <div class="d-flex align-items-center">
            <span class="fw-bold me-3" th:text="${cart.customerOrder.username + ' (' + cart.customerOrder.phone + ')'}"></span>
            <span class="me-3" th:text="${cart.customerOrder.address}"></span>
            <span class="badge border text-danger border-danger me-3">Mặc định</span>
        </div>
    </div>

    <div class="card mb-3 shadow-sm">
        <div class="card-body">
            <h5 class="card-title"><i class="bi bi-ticket-perforated"></i> Voucher của bạn</h5>
            <div class="input-group">
                <input type="text" id="discountInput" name="discountCode" form="checkoutForm" class="form-control" placeholder="Nhập mã giảm giá...">
                <button type="button" class="btn btn-outline-danger px-4" onclick="applyVoucher()">Áp dụng</button>
            </div>
        </div>
    </div>

    <div th:each="subOrder : ${cart.subOrders}" class="bg-white rounded shadow-sm mb-4">
        <div th:each="item : ${subOrder.orderItems}" class="p-3 border-bottom d-flex align-items-center">
            <div style="width: 50%;" th:text="${item.product.name}"></div>
            <div class="text-center" style="width: 15%;" th:text="'₫' + ${#numbers.formatInteger(item.price, 0, 'POINT')}"></div>
            <div class="text-center" style="width: 15%;" th:text="${item.quantity}"></div>
            <div class="text-center" style="width: 20%;" th:text="'₫' + ${#numbers.formatInteger(item.price * item.quantity, 0, 'POINT')}"></div>
        </div>
        <div class="p-3 text-end border-top">
            Tổng tiền Shop: <span class="shopee-color fs-5 fw-bold" th:text="'₫' + ${#numbers.formatInteger(subOrder.total, 0, 'POINT')}"></span>
        </div>
    </div>

    <div class="bg-white p-4 rounded shadow-sm">
        <h5 class="mb-4 pb-3 border-bottom">Phương thức thanh toán</h5>

        <form id="checkoutForm" th:action="@{/checkout}" method="post">
            <input type="hidden" name="productId" th:value="${productId}">
            <input type="hidden" name="quantity" th:value="${quantity}">

            <div class="mb-4">
                <div class="form-check p-3 border rounded mb-2">
                    <input class="form-check-input ms-0 me-3" type="radio" name="paymentMethod" value="SHOPEE_WALLET" checked>
                    <label class="form-check-label">Ví Shopee (Số dư: ₫[[${#numbers.formatInteger(cart.customerOrder.balance, 0, 'POINT')}]])</label>
                </div>
            </div>

            <div class="row justify-content-end text-end" style="font-size: 0.9rem; line-height: 2;">
                <div class="col-3 text-secondary">Tổng tiền hàng</div>
                <div class="col-2" id="rawTotal" th:data-value="${cart.total}" th:text="'₫' + ${#numbers.formatInteger(cart.total, 0, 'POINT')}"></div>
            </div>

            <div class="row justify-content-end text-end" style="font-size: 0.9rem; line-height: 2;">
                <div class="col-3 text-secondary">Giảm giá</div>
                <div class="col-2 text-danger" id="discountDisplay" th:text="'₫' + ${#numbers.formatInteger(cart.discountAmount ?: 0, 0, 'POINT')}"></div>
            </div>

            <div class="row justify-content-end text-end mb-4" style="line-height: 2;">
                <div class="col-3 text-secondary">Tổng thanh toán</div>
                <div class="col-2 shopee-color fs-3 fw-bold" id="finalTotalDisplay" th:text="'₫' + ${#numbers.formatInteger(cart.total - (cart.discountAmount ?: 0), 0, 'POINT')}"></div>
            </div>

            <div class="text-end border-top pt-4">
                <button type="submit" class="btn btn-danger px-5 py-2 fs-5 shopee-bg-color">Đặt Hàng</button>
            </div>
        </form>
    </div>
</main>

<script th:inline="javascript">
    function applyVoucher() {
        // Lấy giá trị từ các ID đã đặt ở trên
        const codeInput = document.getElementById('discountInput');
        const rawTotalElement = document.getElementById('rawTotal');

        if (!codeInput || !rawTotalElement) return;

        const code = codeInput.value;
        const total = rawTotalElement.getAttribute('data-value');

        if (!code) {
            alert("Vui lòng nhập mã!");
            return;
        }

        fetch(`/api/discount/check?code=${code}&orderTotal=${total}`)
            .then(response => response.json())
            .then(data => {
                const msgDiv = document.getElementById('voucherMessage');
                const msgText = document.getElementById('messageText');

                msgDiv.classList.remove('d-none', 'alert-danger', 'alert-success');

                if (data.success) {
                    msgDiv.classList.add('alert-success');
                    msgText.innerText = "Áp dụng mã thành công!";

                    const discount = data.discountValue;
                    // Cập nhật hiển thị (định dạng tiếng Việt)
                    document.getElementById('discountDisplay').innerText = "- ₫" + discount.toLocaleString('vi-VN');
                    document.getElementById('finalTotalDisplay').innerText = "₫" + (total - discount).toLocaleString('vi-VN');
                } else {
                    msgDiv.classList.add('alert-danger');
                    msgText.innerText = data.message;
                }
            })
            .catch(err => {
                console.error("Lỗi:", err);
                alert("Không thể kết nối với máy chủ!");
            });
    }
</script>
</body>
</html>
