<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
    <title>Shopee Việt Nam | Mua và Bán Trực Tuyến</title>
</head>
<body>
    <div th:replace="~{layout/main :: header}"></div>

    <main class="container my-4">
        <!-- Banner Carousel -->
        <div id="shopeeBanner" class="carousel slide mb-4" data-bs-ride="carousel">
            <div class="carousel-inner rounded">
                <div class="carousel-item active">
                    <img src="https://vending-cdn.kootoro.com/torov-cms/upload/image/1669369974824-c%C3%A1c%20lo%E1%BA%A1i%20banner%20qu%E1%BA%A3ng%20c%C3%A1o.jpg" class="d-block w-100" alt="Banner 1" style="height: 300px; object-fit: cover;">
                </div>
                <div class="carousel-item">
                    <img src="https://rubicmarketing.com/wp-content/uploads/2022/03/thiet-ke-banner-quang-cao-online-1.jpg" class="d-block w-100" alt="Banner 2" style="height: 300px; object-fit: cover;">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#shopeeBanner" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#shopeeBanner" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>

        <!-- Categories Section -->
        <div class="bg-white p-3 mb-4 rounded shadow-sm">
            <h6 class="text-secondary mb-3">DANH MỤC</h6>
            <div class="row row-cols-2 row-cols-md-5 row-cols-lg-10 g-2">
                <div class="col text-center border p-2 cursor-pointer hover-bg">
                    <i class="fas fa-tshirt fa-2x mb-2 shopee-color"></i>
                    <div style="font-size: 0.8rem;">Thời Trang Nam</div>
                </div>
                <div class="col text-center border p-2 cursor-pointer hover-bg">
                    <i class="fas fa-mobile-alt fa-2x mb-2 shopee-color"></i>
                    <div style="font-size: 0.8rem;">Điện Thoại</div>
                </div>
                <div class="col text-center border p-2 cursor-pointer hover-bg">
                    <i class="fas fa-laptop fa-2x mb-2 shopee-color"></i>
                    <div style="font-size: 0.8rem;">Máy Tính</div>
                </div>
                <div class="col text-center border p-2 cursor-pointer hover-bg">
                    <i class="fas fa-camera fa-2x mb-2 shopee-color"></i>
                    <div style="font-size: 0.8rem;">Máy Ảnh</div>
                </div>
                <div class="col text-center border p-2 cursor-pointer hover-bg">
                    <i class="fas fa-headphones fa-2x mb-2 shopee-color"></i>
                    <div style="font-size: 0.8rem;">Thiết Bị Điện Tử</div>
                </div>
                <!-- Thêm nhiều danh mục khác nếu muốn -->
            </div>
        </div>

        <!-- Shop Search Results -->
        <div th:if="${shops != null and !shops.empty}" class="bg-white p-3 mb-4 rounded shadow-sm">
            <h6 class="text-secondary mb-3">CỬA HÀNG</h6>
            <div class="row row-cols-2 row-cols-md-5 g-2">
                <div th:each="shop : ${shops}" class="col text-center border p-2 cursor-pointer hover-bg">
                    <a th:href="@{'/shop/' + ${shop.accountId}}" class="text-decoration-none text-dark">
                        <i class="fas fa-store fa-2x mb-2 shopee-color"></i>
                        <div style="font-size: 0.8rem;" th:text="${shop.username}">Tên Shop</div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Shop Info (if viewing a shop) -->
        <div th:if="${shop != null}" class="bg-white p-4 mb-4 rounded shadow-sm d-flex align-items-center">
            <div class="rounded-circle bg-light d-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                <i class="fas fa-store fa-3x shopee-color"></i>
            </div>
            <div class="ms-4">
                <h4 th:text="${shop.username}">Tên Shop</h4>
                <div class="text-secondary small">
                    <span class="me-3"><i class="fas fa-box me-1"></i> Sản phẩm: <span th:text="${products.size()}">0</span></span>
                    <span><i class="fas fa-star me-1"></i> Đánh giá: 4.9 (1.2k)</span>
                </div>
            </div>
        </div>

        <!-- Gợi ý hôm nay -->
        <div class="sticky-top bg-white py-3 border-bottom mb-3" style="top: 0; z-index: 100;">
            <h5 class="text-center shopee-color fw-bold" th:text="${keyword != null ? 'KẾT QUẢ TÌM KIẾM CHO: ' + keyword : (shop != null ? 'SẢN PHẨM CỦA SHOP' : 'GỢI Ý HÔM NAY')}">GỢI Ý HÔM NAY</h5>
        </div>

        <!-- Product Grid -->
        <div class="row g-3">
            <div th:each="product : ${products}" class="col-6 col-md-4 col-lg-2">
                <a th:href="@{'/product/detail/' + ${product.productId}}" class="text-decoration-none text-dark">
                    <div class="card card-product h-100">
                        <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://via.placeholder.com/200'}" class="card-img-top" alt="Product" style="height: 180px; object-fit: cover;">
                        <div class="card-body p-2">
                            <h6 class="card-title text-truncate-2 mb-2" style="font-size: 0.85rem; height: 2.4rem;" th:text="${product.name}">Tên sản phẩm</h6>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <span class="shopee-color fs-5" th:text="'₫' + ${#numbers.formatInteger(product.price, 0, 'POINT')}">₫0</span>
                                <span class="text-secondary" style="font-size: 0.7rem;" th:text="'Đã bán ' + ${product.sold != null ? product.sold : 0}">Đã bán 0</span>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
            <div th:if="${products.empty}" class="col-12 text-center py-5">
                <img src="https://deo.shopeemobile.com/shopee/shopee-pcmall-live-sg/assets/a60759ad1dabe909c46a817ecbf71878.png" alt="No product" style="width: 100px;">
                <p class="text-secondary mt-3">Không tìm thấy sản phẩm nào</p>
            </div>
        </div>

        <div class="text-center mt-5">
            <button class="btn btn-outline-secondary px-5 py-2">Xem thêm</button>
        </div>
    </main>

    <div th:replace="~{layout/main :: footer}"></div>
    
    <style>
        .text-truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hover-bg:hover {
            background-color: #f8f8f8;
            box-shadow: inset 0 0 1px var(--shopee-orange);
        }
    </style>
</body>
</html>
