<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
    <title>Đặt hàng thành công | Shopee</title>
</head>
<body>
    <div th:replace="~{layout/main :: header}"></div>

    <main class="container my-5 text-center">
        <div class="bg-white p-5 rounded shadow-sm">
            <div class="mb-4">
                <i class="fas fa-check-circle text-success" style="font-size: 5rem;"></i>
            </div>
            <h2 class="mb-3">Đặt hàng thành công!</h2>
            <p class="text-secondary mb-4">Cảm ơn bạn đã mua sắm tại Shopee. Đơn hàng của bạn đang được xử lý.</p>
            
            <div class="alert alert-light border mb-4 d-inline-block px-5">
                Mã đơn hàng: <span class="fw-bold shopee-color" th:text="${orderCode}">#0</span>
            </div>
            
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="/" class="btn btn-outline-danger px-4 py-2">Tiếp tục mua sắm</a>
                <a href="/profile" class="btn btn-danger px-4 py-2 shopee-bg-color">Xem lịch sử đơn hàng</a>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
