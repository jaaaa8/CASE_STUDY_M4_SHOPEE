<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật sản phẩm | Kênh Người Bán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --shopee-orange: #ee4d2d; }
        body { background-color: #f6f6f6; }
        .seller-navbar { background-color: white; border-bottom: 1px solid #e8e8e8; }
        .card-custom { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .shopee-color { color: var(--shopee-orange); }
        .btn-shopee { background-color: var(--shopee-orange); color: white; border: none; }
        .btn-shopee:hover { opacity: 0.9; color: white; }
    </style>
</head>
<body>
    <nav class="navbar seller-navbar sticky-top mb-4">
        <div class="container px-4">
            <a class="navbar-brand d-flex align-items-center" href="/seller">
                <i class="fab fa-shopee me-2 shopee-color" style="font-size: 2rem;"></i>
                <span class="fw-bold">Kênh Người Bán</span>
            </a>
            <span class="fs-5 ms-3 border-start ps-3">Cập nhật sản phẩm</span>
        </div>
    </nav>

    <div class="container pb-5">
        <form action="/seller/product/update" method="POST">
            <div class="card card-custom mb-4">
                <div class="card-body p-4">
                    <h5 class="mb-4">Thông tin cơ bản</h5>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Tên sản phẩm</label>
                        <input type="text" class="form-control" value="Giày Sneaker Nam Nữ Thể Thao Cao Cấp Mẫu Mới 2024" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Mô tả sản phẩm</label>
                        <textarea class="form-control" rows="8" required>Mô tả chi tiết về sản phẩm giày sneaker mẫu mới 2024...</textarea>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Danh mục</label>
                            <select class="form-select">
                                <option>Thời Trang Nam</option>
                                <option selected>Giày Dép Nam</option>
                                <option>Thể Thao & Du Lịch</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-custom mb-4">
                <div class="card-body p-4">
                    <h5 class="mb-4">Thông tin bán hàng</h5>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Giá</label>
                            <div class="input-group">
                                <span class="input-group-text">₫</span>
                                <input type="number" class="form-control" value="150000" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Kho hàng</label>
                            <input type="number" class="form-control" value="100" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-custom mb-4">
                <div class="card-body p-4">
                    <h5 class="mb-4">Hình ảnh sản phẩm</h5>
                    <div class="row g-2">
                        <div class="col-auto">
                            <div class="position-relative border rounded" style="width: 100px; height: 100px;">
                                <img src="https://down-vn.img.susercontent.com/file/vn-11134207-7ras8-m1m6qf6vj4zv4f" class="w-100 h-100 object-fit-cover rounded">
                                <button type="button" class="btn btn-dark btn-sm position-absolute top-0 end-0 py-0 px-1 opacity-75" style="font-size: 0.7rem;">×</button>
                            </div>
                        </div>
                        <div class="col-auto">
                            <div class="border border-dashed rounded d-flex align-items-center justify-content-center bg-light" style="width: 100px; height: 100px; cursor: pointer;">
                                <i class="fas fa-plus text-secondary"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-3">
                <a href="/seller" class="btn btn-outline-secondary px-4">Hủy</a>
                <button type="submit" class="btn btn-shopee px-5">Cập nhật</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
