<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm mới | Kênh Người Bán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --shopee-orange: #ee4d2d; }
        body { background-color: #f6f6f6; }
        .seller-navbar { background-color: white; border-bottom: 1px solid #e8e8e8; }
        .card-custom { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .shopee-color { color: var(--shopee-orange); }
        .btn-shopee { background-color: var(--shopee-orange); color: white; border: none; }
        .btn-shopee:hover { opacity: 0.9; color: white; }
    </style>
</head>
<body>
    <nav class="navbar seller-navbar sticky-top mb-4">
        <div class="container px-4">
            <a class="navbar-brand d-flex align-items-center" href="/seller">
                <i class="fab fa-shopee me-2 shopee-color" style="font-size: 2rem;"></i>
                <span class="fw-bold">Kênh Người Bán</span>
            </a>
            <span class="fs-5 ms-3 border-start ps-3">Thêm sản phẩm mới</span>
        </div>
    </nav>

    <div class="container pb-5">
        <form action="/seller/product/create" method="POST">
            <div class="card card-custom mb-4">
                <div class="card-body p-4">
                    <h5 class="mb-4">Thông tin cơ bản</h5>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Tên sản phẩm</label>
                        <input type="text" class="form-control" placeholder="Nhập vào" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Mô tả sản phẩm</label>
                        <textarea class="form-control" rows="8" placeholder="Nhập vào" required></textarea>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Danh mục</label>
                            <select class="form-select">
                                <option selected>Chọn danh mục</option>
                                <option>Thời Trang Nam</option>
                                <option>Điện Thoại & Phụ Kiện</option>
                                <option>Thiết Bị Điện Tử</option>
                                <option>Máy Tính & Laptop</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-custom mb-4">
                <div class="card-body p-4">
                    <h5 class="mb-4">Thông tin bán hàng</h5>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Giá</label>
                            <div class="input-group">
                                <span class="input-group-text">₫</span>
                                <input type="number" class="form-control" placeholder="Nhập vào" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Kho hàng</label>
                            <input type="number" class="form-control" placeholder="0" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-custom mb-4">
                <div class="card-body p-4">
                    <h5 class="mb-4">Quản lý hình ảnh</h5>
                    <div class="border border-dashed p-5 text-center bg-light">
                        <i class="fas fa-plus-square fa-3x text-secondary mb-2"></i>
                        <p class="text-secondary mb-0">Thêm hình ảnh (Tối đa 9 ảnh)</p>
                        <input type="file" class="d-none">
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-3">
                <a href="/seller" class="btn btn-outline-secondary px-4">Hủy</a>
                <button type="submit" class="btn btn-shopee px-5">Lưu & Hiển thị</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
