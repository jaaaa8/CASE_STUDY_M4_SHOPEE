<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="admin-head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Admin Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --admin-sidebar-width: 250px;
            --shopee-orange: #ee4d2d;
        }
        body { background-color: #f8f9fa; }
        .sidebar {
            width: var(--admin-sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            background-color: #343a40;
            color: white;
            padding-top: 20px;
        }
        .main-content {
            margin-left: var(--admin-sidebar-width);
            padding: 20px;
        }
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .shopee-color { color: var(--shopee-orange); }
    </style>
</head>

<body>
<div th:fragment="admin-sidebar" class="sidebar">
    <div class="text-center mb-4">
        <h4 class="shopee-color fw-bold"><i class="fab fa-shopee me-2"></i>Admin</h4>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link" th:classappend="${activePage == 'home' ? 'active' : ''}" href="/admin/home">
            <i class="fas fa-tachometer-alt me-2"></i>Tổng quan
        </a>
        <a class="nav-link" th:classappend="${activePage == 'account' ? 'active' : ''}" href="/admin/account">
            <i class="fas fa-users me-2"></i>Quản lý tài khoản
        </a>
        <a class="nav-link" th:classappend="${activePage == 'product' ? 'active' : ''}" href="/admin/product">
            <i class="fas fa-box me-2"></i>Quản lý sản phẩm
        </a>
        <a class="nav-link" href="/admin/order"><i class="fas fa-shopping-bag me-2"></i>Quản lý đơn hàng</a>
        <a class="nav-link" href="/admin/transactions"><i class="fas fa-exchange-alt me-2"></i>Giao dịch</a>
        <a class="nav-link" href="/admin/category"><i class="fas fa-list me-2"></i>Danh mục</a>
        <a class="nav-link" href="/admin/discounts"><i class="fas fa-list me-2"></i>Voucher</a>
        <hr class="bg-light mx-3">
        <a class="nav-link" href="/"><i class="fas fa-sign-out-alt me-2"></i>Thoát</a>
    </nav>
</div>
</body>
</html>
