<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Quản lý Giao Dịch')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>

<div th:replace="~{admin/fragments/layout :: admin-sidebar}"></div>

<div class="main-content">
  <div class="container-fluid mt-4">
    <h2 class="fw-bold text-dark mb-4">LỊCH SỬ GIAO DỊCH</h2>

    <div th:if="${transactions != null}" class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
              <th class="ps-3">ID</th>
              <th>Tài khoản</th>
              <th>Loại</th>
              <th>Số tiền</th>
              <th>Số dư sau</th>
              <th>Mô tả</th>
              <th>Ngày tạo</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="t : ${transactions.content}">
              <td class="ps-3 fw-bold" th:text="${t.transactionId}"></td>
              <td th:text="${t.accountTransaction.username}"></td>
              <td>
                                <span th:classappend="${t.type == 'DEPOSIT' ? 'badge bg-success' : 'badge bg-danger'}"
                                      th:text="${t.type}">
                                </span>
              </td>
              <td class="fw-bold text-primary"
                  th:text="${#numbers.formatDecimal(t.amount, 0, 'COMMA', 0, 'POINT') + ' đ'}">
              </td>
              <td th:text="${#numbers.formatDecimal(t.balanceAfter, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
              <td th:text="${t.description}" class="text-muted small"></td>
              <td th:text="${#temporals.format(t.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:if="${transactions == null || transactions.totalElements == 0}" class="alert alert-warning mt-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      Không có dữ liệu giao dịch.
    </div>

    <nav th:if="${transactions != null && transactions.totalPages > 1}" class="mt-4">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${!transactions.hasPrevious()} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/transactions(page=${transactions.number-1})}">
            <i class="bi bi-chevron-left"></i>
          </a>
        </li>

        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, transactions.totalPages - 1)}"
            th:classappend="${i == transactions.number} ? 'active'">
          <a class="page-link" th:href="@{/admin/transactions(page=${i})}" th:text="${i + 1}"></a>
        </li>

        <li class="page-item" th:classappend="${!transactions.hasNext()} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/transactions(page=${transactions.number+1})}">
            <i class="bi bi-chevron-right"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
