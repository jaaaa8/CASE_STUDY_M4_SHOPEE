<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Quản lý Danh Mục')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>

<div th:replace="~{admin/fragments/layout :: admin-sidebar}"></div>

<div class="main-content">
    <div class="container-fluid mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">QUẢN LÝ DANH MỤC</h2>
            <a href="/admin/category/create" class="btn btn-primary shadow-sm">
                <i class="bi bi-plus-circle me-2"></i>Thêm danh mục mới
            </a>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <form method="get" action="/admin/category" class="row g-2">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text" name="name"
                                   class="form-control border-start-0"
                                   placeholder="Tìm kiếm danh mục theo tên..."
                                   th:value="${param.name}">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-dark w-100">Tìm kiếm</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Tên danh mục</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${categories.content}">
                            <td class="ps-4 fw-bold" th:text="${c.categoryId}"></td>
                            <td th:text="${c.name}"></td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <a th:href="@{/admin/category/edit/{id}(id=${c.categoryId})}"
                                       class="btn btn-sm btn-outline-primary" title="Sửa">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a th:href="@{/admin/category/delete/{id}(id=${c.categoryId})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?')"
                                       title="Xóa">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${categories.totalElements == 0}">
                            <td colspan="3" class="text-center py-4 text-muted">
                                Không tìm thấy danh mục nào.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <nav th:if="${categories.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!categories.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/category(page=${categories.number-1}, name=${param.name})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, categories.totalPages - 1)}"
                    th:classappend="${i == categories.number} ? 'active'">
                    <a class="page-link" th:href="@{/admin/category(page=${i}, name=${param.name})}" th:text="${i + 1}"></a>
                </li>

                <li class="page-item" th:classappend="${!categories.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/category(page=${categories.number+1}, name=${param.name})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
