
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Thêm Mới Danh Mục')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>

<div th:replace="~{admin/fragments/layout :: admin-sidebar}"></div>

<div class="main-content">
<form th:action="@{/admin/category/create}" th:object="${category}" method="post">

    <div>
        <label>Name:</label>
        <input type="text" th:field="*{name}" required>
    </div>
    <br>

    <button type="submit">Create</button>

    <a th:href="@{/admin/category}">Cancel</a>

</form>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
