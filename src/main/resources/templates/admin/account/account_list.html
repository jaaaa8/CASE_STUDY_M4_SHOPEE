<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>Account Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body>
<div th:replace="admin/layout/admin_layout :: adminSidebar"></div>
<div class="container mt-5">

    <h2 class="mb-4 text-center">Account Management</h2>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark text-center">
        <tr>
            <th>STT</th>
            <th>Username</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Certified</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="account, stat : ${accounts}">
            <td class="text-center" th:text="${stat.index + 1}"></td>
            <td th:text="${account.username}"></td>
            <td th:text="${account.email}"></td>
            <td th:text="${account.phone}"></td>
            <td th:text="${account.address}"></td>

            <!-- Certified Column -->
            <td class="text-center">
                <span th:if="${account.certified}" class="text-success">
                    <i class="bi bi-patch-check-fill"></i>
                </span>
                <span th:unless="${account.certified}" class="text-secondary">
                    <i class="bi bi-x-circle"></i>
                </span>
            </td>

            <!-- Action Column -->
            <td class="text-center">

                <!-- Detail -->
                <a th:href="@{/admin/account/detail/{id}(id=${account.accountId})}"
                   class="btn btn-info btn-sm">
                    <i class="bi bi-eye"></i>
                </a>

                <!-- Update -->
                <a th:href="@{/admin/account/update/{id}(id=${account.accountId})}"
                   class="btn btn-warning btn-sm">
                    <i class="bi bi-pencil-square"></i>
                </a>

                <!-- Delete -->
                <a th:href="@{/admin/account/delete/{id}(id=${account.accountId})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this account?')">
                    <i class="bi bi-trash"></i>
                </a>

                <!-- Lock / Unlock -->
                <a th:if="${account.active}"
                   th:href="@{/admin/account/lock/{id}(id=${account.accountId})}"
                   class="btn btn-secondary btn-sm">
                    <i class="bi bi-lock"></i>
                </a>

                <a th:unless="${account.active}"
                   th:href="@{/admin/account/unlock/{id}(id=${account.accountId})}"
                   class="btn btn-success btn-sm">
                    <i class="bi bi-unlock"></i>
                </a>

            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(accounts)}">
            <td colspan="7" class="text-center text-danger">
                No accounts found
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
