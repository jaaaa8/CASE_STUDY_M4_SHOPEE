<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>Account Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body>
<div th:replace="admin/layout/admin_layout :: adminSidebar"></div>
<form th:action="@{/admin/account/search}" method="get" class="row mb-4">

    <div class="col-md-3">
        <input type="text" name="username"
               th:value="${username}"
               class="form-control"
               placeholder="Search by username">
    </div>

    <div class="col-md-3">
        <input type="text" name="email"
               th:value="${email}"
               class="form-control"
               placeholder="Search by email">
    </div>

    <div class="col-md-3">
        <input type="text" name="phone"
               th:value="${phone}"
               class="form-control"
               placeholder="Search by phone">
    </div>

    <div class="col-md-3">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-search"></i> Search
        </button>

        <a th:href="@{/admin/account}" class="btn btn-secondary">
            Reset
        </a>
    </div>

</form>
<div class="container mt-5">

    <h2 class="mb-4 text-center">Account Management</h2>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark text-center">
        <tr>
            <th>STT</th>
            <th>Username</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Certified</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="account, stat : ${accounts}">
            <td class="text-center" th:text="${stat.index + 1}"></td>
            <td th:text="${account.username}"></td>
            <td th:text="${account.email}"></td>
            <td th:text="${account.phone}"></td>
            <td th:text="${account.address}"></td>

            <!-- Certified Column -->
            <td class="text-center">

                <!-- Nếu đã certified -->
                <span th:if="${account.certified}" class="text-success">
        <i class="bi bi-patch-check-fill"></i>
    </span>

                <!-- Nếu chưa certified -->
                <span th:unless="${account.certified}" class="text-secondary">
        <i class="bi bi-x-circle"></i>
    </span>

                <br/>

                <!-- Nút Grant -->
                <a th:if="${!account.certified}"
                   th:href="@{/admin/account/grantCertificatedSeller/{id}(id=${account.accountId})}"
                   class="btn btn-primary btn-sm mt-1"
                   onclick="return confirm('Grant certified seller?')">
                    Grant
                </a>

                <!-- Nút Remove -->
                <a th:if="${account.certified}"
                   th:href="@{/admin/account/removeCertificatedSeller/{id}(id=${account.accountId})}"
                   class="btn btn-warning btn-sm mt-1"
                   onclick="return confirm('Remove certified seller?')">
                    Remove
                </a>

            </td>

            <!-- Action Column -->
            <td class="text-center">

                <!-- Detail -->
                <a th:href="@{/admin/account/detail/{id}(id=${account.accountId})}"
                   class="btn btn-info btn-sm">
                    <i class="bi bi-eye"></i>
                </a>

                <!-- Lock / Unlock -->
                <!-- Nếu đang active → cho nút LOCK -->
                <a th:if="${account.active}"
                   th:href="@{/admin/account/lock/{id}(id=${account.accountId})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Lock this account?')">
                    <i class="bi bi-lock-fill"></i>
                </a>

                <!-- Nếu đang locked → cho nút UNLOCK -->
                <a th:unless="${account.active}"
                   th:href="@{/admin/account/unlock/{id}(id=${account.accountId})}"
                   class="btn btn-success btn-sm"
                   onclick="return confirm('Unlock this account?')">
                    <i class="bi bi-unlock-fill"></i>
                </a>

            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(accounts)}">
            <td colspan="7" class="text-center text-danger">
                No accounts found
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
