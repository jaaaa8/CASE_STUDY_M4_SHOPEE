<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h4>Account Detail</h4>
        </div>

        <div class="card-body">
            <div class="row mb-3">
                <div class="col-3 fw-bold">Username:</div>
                <div class="col-9" th:text="${account.username}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-3 fw-bold">Email:</div>
                <div class="col-9" th:text="${account.email}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-3 fw-bold">Phone:</div>
                <div class="col-9" th:text="${account.phone}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-3 fw-bold">Address:</div>
                <div class="col-9" th:text="${account.address}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-3 fw-bold">Role:</div>
                <div class="col-9" th:text="${account.role.name}"></div>
            </div>

        </div>

        <div class="card-footer text-end">
            <a th:href="@{/admin/account}" class="btn btn-secondary">Back</a>
        </div>
    </div>
</div>

</body>
</html>
