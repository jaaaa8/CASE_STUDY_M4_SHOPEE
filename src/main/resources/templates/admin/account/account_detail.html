<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Detail</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body>

<!-- Sidebar -->
<div th:replace="admin/layout/admin_layout :: adminSidebar"></div>

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Account Detail</h4>
        </div>

        <div class="card-body">

            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Account ID:</div>
                <div class="col-md-9" th:text="${account.accountId}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Username:</div>
                <div class="col-md-9" th:text="${account.username}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Email:</div>
                <div class="col-md-9" th:text="${account.email}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Phone:</div>
                <div class="col-md-9" th:text="${account.phone}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Address:</div>
                <div class="col-md-9" th:text="${account.address}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Certified:</div>
                <div class="col-md-9">
                    <span th:if="${account.certified}" class="text-success">
                        <i class="bi bi-patch-check-fill"></i> Certified
                    </span>
                    <span th:unless="${account.certified}" class="text-secondary">
                        <i class="bi bi-x-circle"></i> Not Certified
                    </span>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3 fw-bold">Status:</div>
                <div class="col-md-9">
                    <span th:if="${account.active}" class="badge bg-success">
                        Active
                    </span>
                    <span th:unless="${account.active}" class="badge bg-danger">
                        Locked
                    </span>
                </div>
            </div>

        </div>

        <div class="card-footer text-end">
            <a th:href="@{/admin/account}"
               class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>

            <a th:href="@{/admin/account/update/{id}(id=${account.accountId})}"
               class="btn btn-warning">
                <i class="bi bi-pencil-square"></i> Edit
            </a>
        </div>

    </div>

</div>

</body>
</html>
