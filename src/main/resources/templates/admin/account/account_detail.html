<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Chi tiết Tài khoản')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>
<div th:replace="~{admin/fragments/layout :: admin-sidebar}"></div>

<div class="main-content">
    <div class="container-fluid mt-4"> <div class="card shadow border-0">
        <div class="card-header bg-dark text-white d-flex align-items-center">
            <i class="bi bi-person-vcard me-2 fs-4"></i>
            <h4 class="mb-0">Thông tin chi tiết tài khoản</h4>
        </div>

        <div class="card-body">
            <div class="row mb-3 border-bottom pb-2">
                <div class="col-3 fw-bold text-secondary">Username:</div>
                <div class="col-9" th:text="${account.username}"></div>
            </div>

            <div class="row mb-3 border-bottom pb-2">
                <div class="col-3 fw-bold text-secondary">Email:</div>
                <div class="col-9" th:text="${account.email}"></div>
            </div>

            <div class="row mb-3 border-bottom pb-2">
                <div class="col-3 fw-bold text-secondary">Số điện thoại:</div>
                <div class="col-9" th:text="${account.phone}"></div>
            </div>

            <div class="row mb-3 border-bottom pb-2">
                <div class="col-3 fw-bold text-secondary">Địa chỉ:</div>
                <div class="col-9" th:text="${account.address}"></div>
            </div>

            <div class="row mb-3">
                <div class="col-3 fw-bold text-secondary">Vai trò (Role):</div>
                <div class="col-9">
                            <span th:each="ar : ${account.accountRoles}"
                                  class="badge bg-primary me-1 px-3 py-2"
                                  th:text="${ar.role.roleName}">
                            </span>
                </div>
            </div>
        </div>

        <div class="card-footer bg-light text-end">
            <a th:href="@{/admin/account}" class="btn btn-secondary px-4">
                <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
        </div>
    </div>

    </div> </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
