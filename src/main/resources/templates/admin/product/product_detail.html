<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Quản lý Tài khoản')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>

<div th:replace="~{admin/fragments/layout :: admin-sidebar}"></div>

<div class="main-content">


<div class="container mt-5">

  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-header bg-dark text-white rounded-top-4">
      <h4 class="mb-0">
        <i class="bi bi-box-seam"></i> Chi tiết sản phẩm
      </h4>
    </div>

    <div class="card-body">

      <!-- Image -->
      <div class="text-center mb-4">
        <img th:src="${product.imageUrl}"
             class="img-fluid rounded shadow"
             style="max-height:250px; object-fit:cover;">
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Tên sản phẩm:</div>
        <div class="col-md-9" th:text="${product.name}"></div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Mô tả: </div>
        <div class="col-md-9" th:text="${product.description}"></div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Đơn giá:</div>
        <div class="col-md-9">
                    <span class="badge bg-primary"
                          th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">
                    </span>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Tồn kho:</div>
        <div class="col-md-9">
                    <span class="badge bg-success"
                          th:text="${product.stock}">
                    </span>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Danh mục:</div>
        <div class="col-md-9"
            th:text="${product.categoryName}">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Tên người bán:</div>
        <div class="col-md-9"
             th:text="${product.sellerName}">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Đánh giá:</div>
        <div class="col-md-9"
             th:text="${product.reviews != null ? product.reviews.size() : 0}">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Ngày tạo:</div>
        <div class="col-md-9"
             th:text="${#temporals.format(product.createdAt, 'dd/MM/yyyy HH:mm')}">
        </div>
      </div>

    </div>

    <div class="card-footer text-end">
      <a th:href="@{/admin/product}"
         class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Trở về
      </a>
    </div>

  </div>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
