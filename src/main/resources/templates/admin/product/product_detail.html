<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Product Detail</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{admin/layout/admin_layout :: adminSidebar}"></div>

<div class="container mt-5">

  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-header bg-dark text-white rounded-top-4">
      <h4 class="mb-0">
        <i class="bi bi-box-seam"></i> Product Detail
      </h4>
    </div>

    <div class="card-body">

      <!-- Image -->
      <div class="text-center mb-4">
        <img th:src="${product.imageUrl}"
             class="img-fluid rounded shadow"
             style="max-height:250px; object-fit:cover;">
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Name:</div>
        <div class="col-md-9" th:text="${product.name}"></div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Description:</div>
        <div class="col-md-9" th:text="${product.description}"></div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Price:</div>
        <div class="col-md-9">
                    <span class="badge bg-primary"
                          th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">
                    </span>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Stock:</div>
        <div class="col-md-9">
                    <span class="badge bg-success"
                          th:text="${product.stock}">
                    </span>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Category:</div>
        <div class="col-md-9"
             th:text="${product.category_name != null ? product.category_name : 'N/A'}">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Seller:</div>
        <div class="col-md-9"
             th:text="${product.seller != null ? product.seller : 'N/A'}">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Reviews:</div>
        <div class="col-md-9"
             th:text="${product.reviews != null ? product.reviews : 'No reviews'}">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold">Created At:</div>
        <div class="col-md-9"
             th:text="${#temporals.format(product.createdAt, 'dd/MM/yyyy HH:mm')}">
        </div>
      </div>

    </div>

    <div class="card-footer text-end">
      <a th:href="@{/admin/product}"
         class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back
      </a>
    </div>

  </div>

</div>

</body>
</html>
