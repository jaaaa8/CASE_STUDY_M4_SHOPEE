<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Quản lý Sản Phẩm')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>

<div th:replace="~{admin/fragments/layout :: admin-sidebar}"></div>

<div class="main-content">


<div class="container py-5">

    <!-- Card -->
    <div class="card shadow-lg border-0 rounded-4">

        <!-- Card Header -->
        <div class="card-header bg-primary text-white rounded-top-4 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="bi bi-box-seam"></i> Quản lí Sản phẩm
            </h4>

        </div>
        <form th:action="@{/admin/product/search}" method="get" class="row g-3 mb-3">

            <!-- Product Name -->
            <div class="col-md-4">
                <label class="form-label">Tên sản phẩm</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter product name">
            </div>

            <!-- Shop Name -->
            <div class="col-md-4">
                <label class="form-label">Tên shop</label>
                <input type="text"
                       name="shopName"
                       class="form-control"
                       placeholder="Enter shop name">
            </div>

            <!-- Category -->
            <div class="col-md-3">
                <label class="form-label">Danh mục</label>
                <select name="categoryId" class="form-select">
                    <option value="">All Category</option>
                    <option th:each="c : ${categories}"
                            th:value="${c.categoryId}"
                            th:text="${c.name}">
                    </option>
                </select>
            </div>

            <!-- Button -->
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">
                    Search
                </button>
            </div>

        </form>
        <!-- Card Body -->
        <div class="card-body">

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">

                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Tên</th>
                        <th>Hình ảnh</th>
                        <th>Tồn hàng</th>
                        <th>Danh mục</th>
                        <th>Tên shop</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- Product List -->
                    <tr th:each="product, stat : ${products}">

                        <td th:text="${stat.index + 1}"></td>

                        <td class="fw-semibold"
                            th:text="${product.name}">
                        </td>

                        <td>
                            <img th:src="${product.imageUrl}"
                                 class="rounded shadow-sm"
                                 width="60"
                                 height="60"
                                 style="object-fit: cover;">
                        </td>

                        <td>
                                <span class="badge bg-success"
                                      th:text="${product.stock}">
                                </span>
                        </td>

                        <td>
                                <span class="badge bg-info text-dark"
                                      th:text="${product.categoryName}">
                                </span>
                        </td>

                        <td>
                                <span class="badge bg-secondary"
                                      th:text="${product.sellerName}">
                                </span>
                        </td>

                        <!-- Actions -->
                        <td>

                            <!-- Detail -->
                            <a th:href="@{/admin/product/detail/{id}(id=${product.productId})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-eye"></i>
                            </a>


                            <!-- Delete -->
                            <button type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    th:data-id="${product.productId}"
                                    th:data-name="${product.name}"
                                    onclick="prepareDelete(this)">
                                <i class="bi bi-trash"></i>
                            </button>

                        </td>

                    </tr>

                    <!-- No Data -->
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="7" class="text-danger fw-semibold">
                            <i class="bi bi-exclamation-circle"></i>
                            No products found
                        </td>
                    </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

</div>
<div th:if="${message}" th:class="|alert alert-${messageType} alert-dismissible fade show|" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form id="deleteForm" method="post">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteModalLabel">Xác nhận xóa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Bạn có chắc chắn muốn xóa sản phẩm: <strong id="productNameDisplay"></strong>?
                    <p class="text-muted small mt-2">Lưu ý: Hành động này không thể hoàn tác.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                    <button type="submit" class="btn btn-danger">Xác nhận xóa</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
<script>
    function prepareDelete(button) {
        const productId = button.getAttribute('data-id');
        const productName = button.getAttribute('data-name');
        document.getElementById('productNameDisplay').innerText = productName;
        const deleteForm = document.getElementById('deleteForm');
        deleteForm.action = '/admin/product/delete/' + productId;
        const myModal = new bootstrap.Modal(document.getElementById('deleteModal'));
        myModal.show();
    }
    window.setTimeout(function() {
        $(".alert").fadeTo(500, 0).slideUp(500, function(){
            $(this).remove();
        });
    }, 3000);
</script>

</body>
</html>
