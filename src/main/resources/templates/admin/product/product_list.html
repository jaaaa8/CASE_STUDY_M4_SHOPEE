<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Management</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{admin/layout/admin_layout :: adminSidebar}"></div>

<div class="container py-5">

    <!-- Card -->
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-primary text-white rounded-top-4 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="bi bi-box-seam"></i> Product Management
            </h4>

            <a href="#" class="btn btn-light btn-sm">
                <i class="bi bi-plus-circle"></i> Add Product
            </a>
        </div>
        <form th:action="@{/admin/product/search}" method="get" class="row g-3 mb-4">

            <!-- Search Product Name -->
            <div class="col-md-4">
                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Search product name..."
                       th:value="${param.name}">
            </div>

            <!-- Search Shop Name -->
            <div class="col-md-3">
                <input type="text"
                       name="shopName"
                       class="form-control"
                       placeholder="Search shop name..."
                       th:value="${param.shopName}">
            </div>

            <!-- Category Dropdown -->
            <div class="col-md-3">
                <select name="categoryId" class="form-select">
                    <option value="">-- All Category --</option>
                    <option th:each="c : ${categories}"
                            th:value="${c.categoryId}"
                            th:text="${c.name}"
                            th:selected="${param.categoryId == c.categoryId}">
                    </option>
                </select>
            </div>

            <!-- Buttons -->
            <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-dark w-100">
                    <i class="bi bi-search"></i> Search
                </button>

                <a th:href="@{/admin/product}" class="btn btn-secondary w-100">
                    <i class="bi bi-arrow-clockwise"></i>
                </a>
            </div>

        </form>

        <div class="card-body">

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Image</th>
                        <th>Stock</th>
                        <th>Category</th>
                        <th>Seller</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="product, stat : ${products}">
                        <td th:text="${stat.index + 1}"></td>

                        <td class="fw-semibold" th:text="${product.name}"></td>

                        <td>
                            <img th:src="${product.imageUrl}"
                                 class="rounded shadow-sm"
                                 width="60" height="60"
                                 style="object-fit: cover;">
                        </td>

                        <td>
                            <span class="badge bg-success"
                                  th:text="${product.stock}"></span>
                        </td>

                        <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${product.categoryName}"></span>
                        </td>

                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${product.sellerName}"></span>
                        </td>

                        <td>
                            <a th:href="@{/admin/product/detail/{id}(id=${product.productId})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-eye"></i>
                            </a>

                            <a href="#"
                               class="btn btn-sm btn-outline-warning me-1">
                                <i class="bi bi-pencil-square"></i>
                            </a>

                            <a th:href="@{/admin/product/delete/{id}(id=${product.productId})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Delete this product?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="7" class="text-danger fw-semibold">
                            <i class="bi bi-exclamation-circle"></i>
                            No products found
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
