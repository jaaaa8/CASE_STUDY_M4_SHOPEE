<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Quản lý Sản Phẩm')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>

<div th:replace="~{admin/fragments/layout :: admin-sidebar}"></div>

<div class="main-content">


<div class="container py-5">

    <!-- Card -->
    <div class="card shadow-lg border-0 rounded-4">

        <!-- Card Header -->
        <div class="card-header bg-primary text-white rounded-top-4 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="bi bi-box-seam"></i> Product Management
            </h4>

            <a href="#" class="btn btn-light btn-sm">
                <i class="bi bi-plus-circle"></i> Add Product
            </a>
        </div>
        <form th:action="@{/admin/product/search}" method="get" class="row g-3 mb-3">

            <!-- Product Name -->
            <div class="col-md-4">
                <label class="form-label">Product Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       placeholder="Enter product name">
            </div>

            <!-- Shop Name -->
            <div class="col-md-4">
                <label class="form-label">Shop Name</label>
                <input type="text"
                       name="shopName"
                       class="form-control"
                       placeholder="Enter shop name">
            </div>

            <!-- Category -->
            <div class="col-md-3">
                <label class="form-label">Category</label>
                <select name="categoryId" class="form-select">
                    <option value="">All Category</option>
                    <option th:each="c : ${categories}"
                            th:value="${c.id}"
                            th:text="${c.name}">
                    </option>
                </select>
            </div>

            <!-- Button -->
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">
                    Search
                </button>
            </div>

        </form>
        <!-- Card Body -->
        <div class="card-body">

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">

                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Image</th>
                        <th>Stock</th>
                        <th>Category</th>
                        <th>Seller</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <!-- Product List -->
                    <tr th:each="product, stat : ${products}">

                        <td th:text="${stat.index + 1}"></td>

                        <td class="fw-semibold"
                            th:text="${product.name}">
                        </td>

                        <td>
                            <img th:src="${product.imageUrl}"
                                 class="rounded shadow-sm"
                                 width="60"
                                 height="60"
                                 style="object-fit: cover;">
                        </td>

                        <td>
                                <span class="badge bg-success"
                                      th:text="${product.stock}">
                                </span>
                        </td>

                        <td>
                                <span class="badge bg-info text-dark"
                                      th:text="${product.categoryName}">
                                </span>
                        </td>

                        <td>
                                <span class="badge bg-secondary"
                                      th:text="${product.sellerName}">
                                </span>
                        </td>

                        <!-- Actions -->
                        <td>

                            <!-- Detail -->
                            <a th:href="@{/admin/product/detail/{id}(id=${product.productId})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-eye"></i>
                            </a>

                            <!-- Edit -->
                            <a href="#"
                               class="btn btn-sm btn-outline-warning me-1">
                                <i class="bi bi-pencil-square"></i>
                            </a>

                            <!-- Delete -->
                            <a th:href="@{/admin/product/delete/{id}(id=${product.productId})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Delete this product?')">
                                <i class="bi bi-trash"></i>
                            </a>

                        </td>

                    </tr>

                    <!-- No Data -->
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="7" class="text-danger fw-semibold">
                            <i class="bi bi-exclamation-circle"></i>
                            No products found
                        </td>
                    </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
