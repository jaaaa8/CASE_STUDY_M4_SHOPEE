<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Quản lý giảm giá')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
  .main-content-wrapper {
    margin-left: 250px; /* Phải khớp với độ rộng Sidebar của bạn */
    padding: 40px 20px;
    background-color: #f8f9fa;
    min-height: 100vh;
  }
  .form-container {
    max-width: 800px; /* Giới hạn độ rộng form để dễ nhìn hơn */
    margin: 0 auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
  }
  .shopee-color { color: #ee4d2d; }
  .btn-save { background-color: #ee4d2d; color: white; border: none; }
  .btn-save:hover { background-color: #d73211; color: white; }
</style>
<body>
<div class="main-content-wrapper">
  <div class="container">
    <div class="form-container">
      <div class="d-flex align-items-center mb-4">
        <a th:href="@{/admin/discounts}" class="btn btn-link text-decoration-none p-0 me-3">
          <i class="bi bi-arrow-left fs-4"></i>
        </a>
        <h3 class="mb-0 fw-bold">Tạo Voucher Mới</h3>
      </div>

      <hr class="mb-4">

      <form th:action="@{/admin/discounts/save}" th:object="${discount}" method="post" class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Mã Voucher</label>
          <input type="text" th:field="*{code}" class="form-control" placeholder="Ví dụ: GIAM20PERCENT" required>
          <div class="form-text">Mã này sẽ hiển thị cho khách hàng.</div>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Loại giảm giá</label>
          <select th:field="*{discountType}" id="discountType" class="form-select" required>
            <option value="PERCENT">Giảm theo phần trăm (%)</option>
            <option value="AMOUNT">Giảm theo số tiền (₫)</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Giá trị giảm</label>
          <div class="input-group">
            <input type="number" th:field="*{discountValue}" class="form-control" required min="1">
            <span class="input-group-text" id="value-unit">%</span>
          </div>
        </div>

        <div id="maxDiscountSection" class="col-md-4">
          <label class="form-label fw-bold">Giảm tối đa (₫)</label>
          <input type="number" th:field="*{maxDiscount}" class="form-control" placeholder="Không bắt buộc">
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Đơn tối thiểu (₫)</label>
          <input type="number" th:field="*{minOrderValue}" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Số lượng phát hành</label>
          <input type="number" th:field="*{usageLimit}" class="form-control" required min="1">
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Ngày bắt đầu</label>
          <input type="datetime-local" th:field="*{startDate}" class="form-control" required>
        </div>
        <div class="col-md-6 offset-md-6">
          <label class="form-label fw-bold">Ngày kết thúc</label>
          <input type="datetime-local" th:field="*{endDate}" class="form-control" required>
        </div>

        <div class="col-12 mt-5">
          <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/admin/discounts}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
            <button type="submit" class="btn btn-save px-5 shadow-sm">Lưu Voucher</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Logic ẩn/hiện và đổi đơn vị khi chọn loại giảm giá
  const typeSelect = document.getElementById('discountType');
  const unitSpan = document.getElementById('value-unit');
  const maxDiscountSection = document.getElementById('maxDiscountSection');

  typeSelect.addEventListener('change', function() {
    if (this.value === 'PERCENT') {
      unitSpan.innerText = '%';
      maxDiscountSection.style.display = 'block';
    } else {
      unitSpan.innerText = '₫';
      maxDiscountSection.style.display = 'none';
    }
  });

  // Chạy lần đầu khi load trang
  window.onload = () => typeSelect.dispatchEvent(new Event('change'));
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
