<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Quản lý giảm giá')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  .main-content-wrapper {
    margin-left: 250px; /* Độ rộng này phải bằng độ rộng Sidebar của bạn */
    padding: 20px;
    transition: all 0.3s;
  }
  /* Fix cho mobile nếu cần */
  @media (max-width: 768px) {
    .main-content-wrapper {
      margin-left: 0;
    }
  }
  .card {
    border: none;
    border-radius: 10px;
  }
  .table th {
    background-color: #f8f9fa;
    text-transform: uppercase;
    font-size: 0.8rem;
    letter-spacing: 0.5px;
  }
</style>

<body>

<div th:replace="~{admin/fragments/layout :: admin-sidebar}"></div>
<div class="main-content-wrapper">
<div class="container-fluid px-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mt-4">Quản lý Voucher</h2>
    <a th:href="@{/admin/discounts/create}" class="btn btn-primary">Thêm mã mới</a>
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-hover">
        <thead class="table-light">
        <tr>
          <th>Code</th>
          <th>Loại</th>
          <th>Giá trị</th>
          <th>Hạn dùng</th>
          <th>Sử dụng</th>
          <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${discounts}">
          <td class="fw-bold" th:text="${d.code}"></td>
          <td>
                            <span th:class="${d.discountType.name() == 'PERCENT' ? 'badge bg-info' : 'badge bg-success'}"
                                  th:text="${d.discountType}"></span>
          </td>
          <td th:text="${d.discountType.name() == 'PERCENT' ? d.discountValue + '%' : '₫' + #numbers.formatInteger(d.discountValue, 0, 'POINT')}"></td>
          <td style="font-size: 0.85rem">
            <span th:text="${#temporals.format(d.startDate, 'dd/MM/yyyy')}"></span> -
            <span th:text="${#temporals.format(d.endDate, 'dd/MM/yyyy')}"></span>
          </td>
          <td th:text="${d.usedCount + '/' + d.usageLimit}"></td>
          <td>
            <a th:href="@{/admin/discounts/delete/{id}(id=${d.discountId})}"
               class="btn btn-sm btn-outline-danger btn-delete">
              <i class="fas fa-trash"></i>
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const deleteButtons = document.querySelectorAll('.btn-delete');

    deleteButtons.forEach(button => {
      button.addEventListener('click', function(e) {
        e.preventDefault(); // Chặn việc chuyển hướng ngay lập tức
        const deleteUrl = this.getAttribute('href');

        Swal.fire({
          title: 'Xác nhận xóa?',
          text: "Dữ liệu Voucher này sẽ không thể khôi phục sau khi xóa!",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#d33', // Màu đỏ cho nút xóa
          cancelButtonColor: '#3085d6',
          confirmButtonText: 'Vẫn xóa!',
          cancelButtonText: 'Hủy',
          reverseButtons: true // Đảo vị trí nút để nút "Hủy" bên trái
        }).then((result) => {
          if (result.isConfirmed) {
            // Nếu đồng ý, chuyển hướng đến URL xóa
            window.location.href = deleteUrl;
          }
        });
      });
    });
  });
</script>
<script th:if="${message}">
  Swal.fire({
    icon: 'success',
    title: 'Thành công!',
    text: [[${message}]],
    timer: 2000,
    showConfirmButton: false
  });
</script>

<script th:if="${error}">
  Swal.fire({
    icon: 'error',
    title: 'Lỗi!',
    text: [[${error}]]
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
