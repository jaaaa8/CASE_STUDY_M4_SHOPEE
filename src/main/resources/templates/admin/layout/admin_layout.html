<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    .sidebar {
        width: 250px;
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        background-color: #212529;
        padding-top: 20px;
    }

    .sidebar .nav-link {
        color: #adb5bd;
        padding: 10px 20px;
    }

    .sidebar .nav-link:hover {
        background-color: #343a40;
        color: #fff;
    }

    .sidebar .nav-link.active {
        background-color: #0d6efd;
        color: #fff;
    }

    .content {
        margin-left: 250px;
        padding: 30px;
    }
</style>
<body>

<!-- ===== SIDEBAR FRAGMENT ===== -->
<div th:fragment="adminSidebar" class="sidebar">
    <div class="text-center mb-4">
        <h4 class="fw-bold text-white">
            <i class="fab fa-shopee me-2"></i>Admin
        </h4>
    </div>

    <nav class="nav flex-column">
        <a class="nav-link"
           th:classappend="${activePage == 'dashboard'} ? ' active'"
           th:href="@{/admin}">
            <i class="fas fa-tachometer-alt me-2"></i>Tổng quan
        </a>

        <a class="nav-link"
           th:classappend="${activePage == 'account'} ? ' active'"
           th:href="@{/admin/account}">
            <i class="fas fa-users me-2"></i>Quản lý tài khoản
        </a>

        <a class="nav-link"
           th:classappend="${activePage == 'product'} ? ' active'"
           th:href="@{/admin/product}">
            <i class="fas fa-box me-2"></i>Quản lý sản phẩm
        </a>

        <a class="nav-link"
           th:classappend="${activePage == 'order'} ? ' active'"
           th:href="@{/admin/order}">
            <i class="fas fa-shopping-bag me-2"></i>Quản lý đơn hàng
        </a>

        <hr class="bg-light mx-3">

        <a class="nav-link" th:href="@{/}">
            <i class="fas fa-sign-out-alt me-2"></i>Thoát
        </a>
    </nav>
</div>

</body>
</html>
