<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: admin-head('Chi tiết đơn hàng')}"></head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>

<div th:replace="~{admin/fragments/layout :: admin-sidebar}"></div>

<div class="main-content">
<div class="container mt-4">

  <h3>Order Detail</h3>

  <div class="card p-3">

    <p><b>Order Code:</b> <span th:text="${order.orderCode}"></span></p>

    <p><b>Customer:</b> <span th:text="${order.customerName}"></span></p>

    <p><b>Status:</b> <span th:text="${order.orderStatus}"></span></p>

    <p><b>Total:</b> <span th:text="${order.total}"></span></p>

  </div>

  <h4 class="mt-4">Products</h4>

  <table class="table table-bordered">

    <thead>
    <tr>
      <th>Product</th>
      <th>Quantity</th>
      <th>Price</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="item : ${order.items}">

      <td th:text="${item.productName}"></td>

      <td th:text="${item.quantity}"></td>

      <td th:text="${item.price}"></td>

    </tr>

    </tbody>

  </table>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
