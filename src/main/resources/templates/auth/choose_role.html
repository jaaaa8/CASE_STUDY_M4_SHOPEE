<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Role</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#4e73df,#224abe);
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .role-card{
            width:420px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .role-btn{
            transition:0.2s;
            font-weight:500;
        }

        .role-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 4px 10px rgba(0,0,0,0.15);
        }

        .title-icon{
            font-size:40px;
            color:#4e73df;
        }
    </style>

</head>

<body>

<div class="card role-card p-4">

    <div class="text-center mb-4">
        <i class="bi bi-person-circle title-icon"></i>
        <h3 class="mt-2">Chọn vai trò</h3>
        <p class="text-muted">Hãy chọn vai trò bạn muốn sử dụng</p>
    </div>

    <div th:each="role : ${roles}" class="mb-3">

        <form th:action="@{/api/auth/select-role}" method="post">

            <input type="hidden" name="role" th:value="${role.authority}">

            <button class="btn btn-primary w-100 role-btn">

                <i class="bi bi-arrow-right-circle me-2"></i>

                <span th:text="${#strings.replace(role.authority,'ROLE_','')}"></span>

            </button>

        </form>

    </div>

</div>

</body>
</html>
