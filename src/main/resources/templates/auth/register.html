<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | Shopee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --shopee-orange: #ee4d2d; }
        body { background-color: var(--shopee-orange); }
        .register-container {
            background-color: white;
            border-radius: 4px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .btn-shopee {
            background-color: var(--shopee-orange);
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 2px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .btn-shopee:hover { color: white; opacity: 0.9; }
        .shopee-header {
            background-color: white;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <header class="shopee-header mb-5">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <a href="/" class="text-decoration-none d-flex align-items-center" style="color: var(--shopee-orange);">
                    <i class="fab fa-shopee me-2" style="font-size: 3rem;"></i>
                    <span class="fs-2 fw-bold">Shopee</span>
                </a>
                <span class="ms-4 fs-4 pt-2">Đăng Ký</span>
            </div>
            <a href="#" class="text-decoration-none" style="color: var(--shopee-orange);">Bạn cần giúp đỡ?</a>
        </div>
    </header>

    <div class="container">
        <div class="row justify-content-end">
            <div class="col-md-5 col-lg-4">
                <div class="register-container">
                    <h5 class="mb-4">Đăng Ký</h5>
                    <form th:action="@{/api/auth/register}" method="post">

                        <div class="mb-3">
                            <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập">
                        </div>

                        <div class="mb-3">
                            <input type="email" name="email" class="form-control" placeholder="Email">
                        </div>

                        <div class="mb-3">
                            <input type="text" name="phone" class="form-control" placeholder="Số điện thoại">
                        </div>

                        <div class="mb-3">
                            <input type="text" name="address" class="form-control" placeholder="Địa chỉ">
                        </div>

                        <div class="mb-3">
                            <input type="password" name="password" class="form-control" placeholder="Mật khẩu">
                        </div>

                        <div class="mb-3">
                            <input type="password" name="confirmPassword" class="form-control" placeholder="Xác nhận mật khẩu">
                        </div>

                        <button type="submit" class="btn btn-shopee mb-3">Đăng Ký</button>

                        <div class="d-flex align-items-center mb-4">
                            <hr class="flex-grow-1">
                            <span class="px-2 text-secondary" style="font-size: 0.8rem;">HOẶC</span>
                            <hr class="flex-grow-1">
                        </div>

                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <button type="button" class="btn btn-outline-secondary w-100">
                                    <i class="fab fa-facebook me-2 text-primary"></i> Facebook
                                </button>
                            </div>

                            <div class="col-6">
                                <button type="button" class="btn btn-outline-secondary w-100">
                                    <i class="fab fa-google me-2 text-danger"></i> Google
                                </button>
                            </div>
                        </div>

                        <div class="text-center" style="font-size: 0.8rem">
                            <span class="text-secondary">Bằng việc đăng ký, bạn đã đồng ý với Shopee về</span><br>
                            <a href="#" class="text-decoration-none shopee-color">Điều khoản dịch vụ</a>
                            &
                            <a href="#" class="text-decoration-none shopee-color">Chính sách bảo mật</a>
                        </div>

                        <div class="text-center mt-4">
                            <span class="text-secondary">Bạn đã có tài khoản?</span>
                            <a href="/login" style="color: var(--shopee-orange);">Đăng nhập</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-5 pt-5 pb-3 text-white text-center" style="font-size: 0.8rem; opacity: 0.8;">
        <div class="container">
            <p>© 2026 Shopee. Tất cả các quyền được bảo lưu.</p>
        </div>
    </footer>
</body>
</html>
